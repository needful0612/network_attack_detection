apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
data:
  init.sql: |
    -- PASTE YOUR init.sql CONTENT HERE
    CREATE TABLE IF NOT EXISTS detections (
        id SERIAL PRIMARY KEY,
        timestamp TIMESTAMP,
        source_ip TEXT,
        anomaly_score FLOAT,
        svm_score FLOAT,
        kitnet_score FLOAT
    );
    -- Add any other tables or hypertable commands from your file
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timescale-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: timescale
        image: timescale/timescaledb:latest-pg15
        env:
        - name: POSTGRES_PASSWORD
          value: "postgres_pass"
        - name: POSTGRES_DB
          value: "nids_db"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/init.sql
          subPath: init.sql # This mounts the key from the ConfigMap as a file
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: timescale-pvc
      - name: init-script
        configMap:
          name: db-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432