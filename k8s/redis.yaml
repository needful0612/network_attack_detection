apiVersion: v1
kind: Service
metadata:
  name: broker # Stable DNS: 'broker:6379'
spec:
  selector:
    app: broker
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broker
  template:
    metadata:
      labels:
        app: broker
    spec:
      containers:
      - name: redis
        image: redis:alpine
        args: ["redis-server", "--save", "", "--appendonly", "no"]
        ports:
        - containerPort: 6379