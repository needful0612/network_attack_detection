global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'traffic-analyzation-workers'
    static_configs:
      - targets: ['svm-service:8000', 'kitnet-service:8000']

  - job_name: 'container-resources'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
  
  - job_name: 'docker-engine'
    static_configs:
      - targets: ['172.17.0.1:9323']